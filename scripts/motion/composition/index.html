<link rel="alternate" type="video/mp4" href="../../../docs/assets/quickstart.mp4">
<link rel="image_src" href="../../../docs/assets/quickstart-poster.png">
<script src="./gsap.min.js"></script>
<style>
:root{--ground:#090c10;--stage-w:1920px;--stage-h:1080px;--panel-w:1200px;--panel-h:811.7647058824px;--surface-shadow:0 20px 64px #0007,0 0 32px #ffffff04;}
*{box-sizing:border-box}html,body{margin:0;width:var(--stage-w);height:var(--stage-h);overflow:hidden;background:var(--ground)}
#main{width:var(--stage-w);height:var(--stage-h);display:grid;place-items:center;background:var(--ground);isolation:isolate}
#viewport{position:relative;width:var(--panel-w);height:var(--panel-h);overflow:hidden;border-radius:48px;box-shadow:var(--surface-shadow);grid-area:1/1}
#native-surface{position:absolute;left:0;top:0;width:2000px;height:1480px;transform-origin:0 0}
#native-capture{display:block;width:2000px;height:1480px;max-width:none;object-fit:contain;background:var(--ground)}
#static-poster{display:none;width:1920px;height:1080px;grid-area:1/1;object-fit:contain}
body.static #viewport{visibility:hidden}body.static #static-poster{display:block}

</head>
<body>
<main id="main" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-fps="30" data-poster-time="3" aria-label="OptionDeck native SwiftUI preview">
<div id="viewport"><div id="native-surface">
<video id="native-capture" class="clip" src="./assets/native-ui.mp4" data-start="0" data-duration="30" data-media-start="0" data-track-index="0" data-volume="0" muted playsinline preload="auto" aria-label="Unaltered native OptionDeck recording"></video>
</div></div>
<img id="static-poster" src="../../../docs/assets/quickstart-poster.png" width="1920" height="1080" alt="Actual native OptionDeck first-page interface">
</main>
<script>
// Source pixels: 2000 x 1480, 450 native frames at 15 fps; no UI recreation.
// Panel-only bounds in those pixels: x=320, y=280, width=1360, height=920.
// Full editor retains the entire 2000 x 1480 recording at 1350 x 999.
const CONFIG=Object.freeze({duration:30,fps:30,sourceFps:15,width:1920,height:1080,
 panel:{width:1200,height:1200*920/1360,scale:1200/1360,x:-320*1200/1360,y:-280*1200/1360,radius:48},
 editor:{width:1350,height:999,scale:.675,x:0,y:0,radius:0},
 transitions:{toEditor:11.45,toEditorDuration:.55,toPanel:28,toPanelDuration:.55}});
const tl=gsap.timeline({paused:true});
const clock={t:0};
const panel=CONFIG.panel,editor=CONFIG.editor;
gsap.set('#viewport',{width:panel.width,height:panel.height,borderRadius:panel.radius});
gsap.set('#native-surface',{x:panel.x,y:panel.y,scale:panel.scale,transformOrigin:'0 0'});
tl.to(clock,{t:CONFIG.duration,duration:CONFIG.duration,ease:'none'},0);
tl.to('#viewport',{width:editor.width,height:editor.height,borderRadius:editor.radius,duration:.55,ease:'power2.inOut'},11.45);
tl.to('#native-surface',{x:editor.x,y:editor.y,scale:editor.scale,duration:.55,ease:'power2.inOut'},11.45);
tl.to('#viewport',{width:panel.width,height:panel.height,borderRadius:panel.radius,duration:.55,ease:'power2.inOut'},28);
tl.to('#native-surface',{x:panel.x,y:panel.y,scale:panel.scale,duration:.55,ease:'power2.inOut'},28);
window.__timelines={main:tl};
window.OPTIONDECK_CONFIG=CONFIG;
// Export: HyperFrames extracts and injects source video frames at each timeline time.
// Do not drive currentTime or play the video in render mode.
// Preview: use the shared timeline; seek the paused native video to its honest 15 fps cadence.
(function nativePreview(){
 if(window.__odMotionRender)return;
 const video=document.getElementById('native-capture');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const thumbnail=window.__odMotionThumbnail===true||new URL(location.href).searchParams.get('odMotionThumbnail')==='1';
 let pending=null,requested=-1;
 function target(t){return Math.min(449,Math.max(0,Math.floor((t+1e-7)*15)))/15;}
 function requestFrame(t){
  const wanted=target(t);
  if(video.readyState<1||video.seeking){pending=wanted;return;}
  if(requested!==wanted){requested=wanted;video.currentTime=wanted;}
 }
 video.addEventListener('seeked',()=>{if(pending!==null){const t=pending;pending=null;requestFrame(t);}});
 function paint(){if(!document.body.classList.contains('static'))requestFrame(tl.time());requestAnimationFrame(paint);}
 requestAnimationFrame(paint);
 window.seek=async function(seconds){
  const t=Math.max(0,Math.min(30,Number(seconds)||0));
  document.body.classList.remove('static');
  if(window.__odMotionPlayer)window.__odMotionPlayer.seek(t);else tl.pause().seek(t,true);
  if(video.readyState<1)await new Promise(resolve=>video.addEventListener('loadedmetadata',resolve,{once:true}));
  const wanted=target(t);
  pending=null;
  if(video.seeking)await new Promise(resolve=>video.addEventListener('seeked',resolve,{once:true}));
  if(Math.abs(video.currentTime-wanted)>.00001){
   await new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});requested=wanted;video.currentTime=wanted;});
  }
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  return {seconds:t,nativeFrame:Math.min(449,Math.floor((t+1e-7)*15))};
 };
 function staticMode(){if(window.__odMotionPlayer)window.__odMotionPlayer.pause();else tl.pause();document.body.classList.add('static');}
 function boot(){
  if(reduced.matches||thumbnail){staticMode();requestAnimationFrame(staticMode);}
  document.getElementById('main').addEventListener('click',()=>document.body.classList.remove('static'));
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
 reduced.addEventListener('change',()=>{if(reduced.matches)staticMode();});
})();
</script>
